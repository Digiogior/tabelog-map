<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="720" height="900" viewBox="0 0 720 900">
  <defs>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.5"/>
      <feOffset dx="0" dy="2" result="offsetblur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.28"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="card-shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2.5"/>
      <feOffset dx="0" dy="2" result="offsetblur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.22"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1976d2"/>
    </marker>
    <style>
      .title       { font: 700 18px "Helvetica Neue", Arial, sans-serif; fill: #1a1a1a; }
      .subtitle    { font: 500 12px "Helvetica Neue", Arial, sans-serif; fill: #666; }
      .chip        { font: 500 13px "Helvetica Neue", Arial, sans-serif; }
      .chip-dark   { fill: #333; }
      .chip-light  { fill: #ffffff; }
      .annot       { font: 700 12px "Helvetica Neue", Arial, sans-serif; fill: #1976d2; }
      .annot-note  { font: 500 11px  "Helvetica Neue", Arial, sans-serif; fill: #1976d2; }
      .annot-dim   { font: 500 11px  "Helvetica Neue", Arial, sans-serif; fill: #888; }
      .annot-dim-h { font: 700 12px  "Helvetica Neue", Arial, sans-serif; fill: #555; }
      .card-name   { font: 600 12px "Helvetica Neue", Arial, sans-serif; fill: #111; }
      .card-rate   { font: 600 11px "Helvetica Neue", Arial, sans-serif; fill: #e74c3c; }
      .card-price  { font: 400 10px "Helvetica Neue", Arial, sans-serif; fill: #888; }
      .card-rank   { font: 700 10px "Helvetica Neue", Arial, sans-serif; fill: #fff; }
      .strip-label { font: 700 10px "Helvetica Neue", Arial, sans-serif; fill: #444; letter-spacing: 0.5px; }
      .legend-h    { font: 700 13px "Helvetica Neue", Arial, sans-serif; fill: #1a1a1a; }
      .legend      { font: 400 12px "Helvetica Neue", Arial, sans-serif; fill: #333; }
      .legend-em   { font: 600 12px "Helvetica Neue", Arial, sans-serif; fill: #e74c3c; }
    </style>
    <symbol id="kids-icon" viewBox="0 0 16 16">
      <circle cx="8" cy="5.2" r="3.2" fill="#f5c596"/>
      <circle cx="6.8" cy="4.8" r="0.55" fill="#3a2a1a"/>
      <circle cx="9.2" cy="4.8" r="0.55" fill="#3a2a1a"/>
      <path d="M6.6 6.4 Q8 7.4 9.4 6.4" stroke="#3a2a1a" stroke-width="0.55" fill="none" stroke-linecap="round"/>
      <path d="M3.4 14 Q3.4 9.4 8 9.4 Q12.6 9.4 12.6 14 Z" fill="#8ec5ff"/>
    </symbol>
    <symbol id="pin" viewBox="0 0 20 26">
      <path d="M10 0 C4.5 0 0 4.4 0 9.8 C0 17 10 26 10 26 C10 26 20 17 20 9.8 C20 4.4 15.5 0 10 0 Z" fill="#e74c3c"/>
      <circle cx="10" cy="9.8" r="3.6" fill="#fff"/>
    </symbol>
  </defs>

  <!-- page background -->
  <rect width="720" height="900" fill="#fafafa"/>

  <!-- title -->
  <text x="30" y="32" class="title">Tabelog Map — proposed filter row</text>
  <text x="30" y="52" class="subtitle">Adds a second chip row beneath categories: rating threshold (&gt; 2★, &gt; 3★) and a “good for kids” toggle.</text>

  <!-- ============================================ -->
  <!-- PHONE FRAME                                   -->
  <!-- ============================================ -->
  <g transform="translate(30,72)">
    <rect x="0" y="0" width="380" height="780" rx="22" ry="22" fill="#e8eef3" stroke="#cfd6de" stroke-width="1.5"/>
    <clipPath id="phoneClip"><rect x="0" y="0" width="380" height="780" rx="22" ry="22"/></clipPath>

    <g clip-path="url(#phoneClip)">
      <!-- map: faux streets -->
      <line x1="-10" y1="300" x2="400" y2="320" stroke="#ffffff" stroke-width="22"/>
      <line x1="-10" y1="300" x2="400" y2="320" stroke="#f0f3f7" stroke-width="20"/>
      <line x1="170" y1="-10" x2="200" y2="790" stroke="#ffffff" stroke-width="16"/>
      <line x1="170" y1="-10" x2="200" y2="790" stroke="#f0f3f7" stroke-width="14"/>
      <line x1="-10" y1="500" x2="400" y2="488" stroke="#ffffff" stroke-width="10"/>
      <line x1="60"  y1="-10" x2="78"  y2="790" stroke="#ffffff" stroke-width="8"/>
      <line x1="300" y1="-10" x2="318" y2="790" stroke="#ffffff" stroke-width="8"/>
      <!-- parks -->
      <ellipse cx="92" cy="430" rx="58" ry="36" fill="#d8ecd0"/>
      <ellipse cx="295" cy="220" rx="48" ry="30" fill="#d8ecd0"/>

      <!-- pins -->
      <g transform="translate(105,260)"><use href="#pin" width="20" height="26"/></g>
      <g transform="translate(225,360)"><use href="#pin" width="20" height="26"/></g>
      <g transform="translate(150,470)"><use href="#pin" width="20" height="26"/></g>
      <g transform="translate(290,420)"><use href="#pin" width="20" height="26"/></g>
      <g transform="translate(70,540)"><use href="#pin" width="20" height="26"/></g>
      <g transform="translate(240,560)"><use href="#pin" width="20" height="26"/></g>

      <!-- ROW 1: existing category chips -->
      <g filter="url(#shadow)">
        <rect x="10" y="14" rx="14" ry="14" width="48" height="28" fill="#e74c3c"/>
        <text x="34" y="32" text-anchor="middle" class="chip chip-light">All</text>
      </g>
      <g filter="url(#shadow)">
        <rect x="64" y="14" rx="14" ry="14" width="64" height="28" fill="#fff"/>
        <text x="96" y="32" text-anchor="middle" class="chip chip-dark">Ramen</text>
      </g>
      <g filter="url(#shadow)">
        <rect x="134" y="14" rx="14" ry="14" width="58" height="28" fill="#fff"/>
        <text x="163" y="32" text-anchor="middle" class="chip chip-dark">Sushi</text>
      </g>
      <g filter="url(#shadow)">
        <rect x="198" y="14" rx="14" ry="14" width="68" height="28" fill="#fff"/>
        <text x="232" y="32" text-anchor="middle" class="chip chip-dark">Izakaya</text>
      </g>
      <g filter="url(#shadow)">
        <rect x="272" y="14" rx="14" ry="14" width="68" height="28" fill="#fff"/>
        <text x="306" y="32" text-anchor="middle" class="chip chip-dark">More ▾</text>
      </g>

      <!-- ROW 2: NEW filter chips -->
      <!-- ★ 2+ -->
      <g filter="url(#shadow)">
        <rect x="10" y="54" rx="14" ry="14" width="60" height="28" fill="#fff"/>
        <text x="40" y="72" text-anchor="middle" class="chip chip-dark">
          <tspan fill="#f5b300">★</tspan> 2+
        </text>
      </g>
      <!-- ★ 3+ (active) -->
      <g filter="url(#shadow)">
        <rect x="76" y="54" rx="14" ry="14" width="60" height="28" fill="#e74c3c"/>
        <text x="106" y="72" text-anchor="middle" class="chip chip-light">★ 3+</text>
      </g>
      <!-- Good for kids (active) -->
      <g filter="url(#shadow)">
        <rect x="142" y="54" rx="14" ry="14" width="146" height="28" fill="#e74c3c"/>
        <g transform="translate(150,58)"><use href="#kids-icon" width="18" height="18"/></g>
        <text x="218" y="72" text-anchor="middle" class="chip chip-light">Good for kids</text>
      </g>

      <!-- Top 3 strip -->
      <g transform="translate(0,640)">
        <text x="14" y="14" class="strip-label">TOP 3 IN RAMEN</text>
        <g transform="translate(14,22)" filter="url(#card-shadow)">
          <rect x="0" y="0" width="110" height="98" rx="10" ry="10" fill="#fff"/>
          <rect x="0" y="0" width="110" height="56" rx="10" ry="10" fill="#f0c8a8"/>
          <rect x="0" y="46" width="110" height="10" fill="#f0c8a8"/>
          <circle cx="14" cy="14" r="9" fill="rgba(0,0,0,0.55)"/>
          <text x="14" y="18" text-anchor="middle" class="card-rank">1</text>
          <text x="8" y="72" class="card-name">Ichiran</text>
          <text x="8" y="85" class="card-rate">★ 3.78</text>
          <text x="8" y="95" class="card-price">¥1000–2000</text>
        </g>
        <g transform="translate(130,22)" filter="url(#card-shadow)">
          <rect x="0" y="0" width="110" height="98" rx="10" ry="10" fill="#fff"/>
          <rect x="0" y="0" width="110" height="56" rx="10" ry="10" fill="#dcc4a0"/>
          <rect x="0" y="46" width="110" height="10" fill="#dcc4a0"/>
          <circle cx="14" cy="14" r="9" fill="rgba(0,0,0,0.55)"/>
          <text x="14" y="18" text-anchor="middle" class="card-rank">2</text>
          <text x="8" y="72" class="card-name">Menya Ryu</text>
          <text x="8" y="85" class="card-rate">★ 3.62</text>
          <text x="8" y="95" class="card-price">¥1000–1500</text>
        </g>
        <g transform="translate(246,22)" filter="url(#card-shadow)">
          <rect x="0" y="0" width="110" height="98" rx="10" ry="10" fill="#fff"/>
          <rect x="0" y="0" width="110" height="56" rx="10" ry="10" fill="#e8d4b8"/>
          <rect x="0" y="46" width="110" height="10" fill="#e8d4b8"/>
          <circle cx="14" cy="14" r="9" fill="rgba(0,0,0,0.55)"/>
          <text x="14" y="18" text-anchor="middle" class="card-rank">3</text>
          <text x="8" y="72" class="card-name">Sugakiya</text>
          <text x="8" y="85" class="card-rate">★ 3.55</text>
          <text x="8" y="95" class="card-price">¥800–1200</text>
        </g>
      </g>
    </g>
  </g>

  <!-- ============================================ -->
  <!-- ANNOTATIONS                                   -->
  <!-- ============================================ -->
  <!-- existing-row annotation (left side, dimmed) -->
  <g>
    <text x="430" y="96"  class="annot-dim-h">Existing</text>
    <text x="430" y="112" class="annot-dim">category chips (unchanged)</text>
    <path d="M425 105 Q 415 105 410 105" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arrow)"/>
  </g>

  <!-- NEW row annotation -->
  <g>
    <text x="430" y="138" class="annot">NEW filter row</text>
    <text x="430" y="155" class="annot-note">below categories</text>
    <text x="430" y="170" class="annot-note">— same scroll + chip style</text>
    <path d="M425 145 Q 415 145 410 145" stroke="#1976d2" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
  </g>

  <!-- behaviour legend -->
  <g transform="translate(430,200)">
    <text x="0" y="0" class="legend-h">Behavior</text>

    <!-- chip examples in legend -->
    <g transform="translate(0,18)">
      <g filter="url(#shadow)">
        <rect x="0" y="0" rx="14" ry="14" width="60" height="28" fill="#fff"/>
        <text x="30" y="18" text-anchor="middle" class="chip chip-dark">
          <tspan fill="#f5b300">★</tspan> 2+
        </text>
      </g>
      <text x="72" y="13" class="legend">inactive — tap to filter</text>
      <text x="72" y="26" class="legend">restaurants with Rating &gt; 2.0</text>
    </g>

    <g transform="translate(0,58)">
      <g filter="url(#shadow)">
        <rect x="0" y="0" rx="14" ry="14" width="60" height="28" fill="#e74c3c"/>
        <text x="30" y="18" text-anchor="middle" class="chip chip-light">★ 3+</text>
      </g>
      <text x="72" y="13" class="legend"><tspan class="legend-em">active</tspan> — Rating &gt; 3.0</text>
      <text x="72" y="26" class="legend">tap again to clear</text>
    </g>

    <g transform="translate(0,98)">
      <text x="0" y="14" class="legend">★ 2+ and ★ 3+ are mutually exclusive.</text>
    </g>

    <g transform="translate(0,124)">
      <g filter="url(#shadow)">
        <rect x="0" y="0" rx="14" ry="14" width="140" height="28" fill="#e74c3c"/>
        <g transform="translate(8,4)"><use href="#kids-icon" width="18" height="18"/></g>
        <text x="84" y="18" text-anchor="middle" class="chip chip-light">Good for kids</text>
      </g>
      <text x="0" y="50" class="legend">Independent on/off toggle.</text>
      <text x="0" y="66" class="legend">Filters where the Kids field</text>
      <text x="0" y="82" class="legend">indicates the restaurant is</text>
      <text x="0" y="98" class="legend">family-friendly.</text>
    </g>

    <g transform="translate(0,238)">
      <text x="0" y="0" class="legend-h">Combined with categories</text>
      <text x="0" y="18" class="legend">Filters AND with the selected</text>
      <text x="0" y="34" class="legend">category. Example shown:</text>
      <text x="0" y="52" class="legend-em">All  +  ★ 3+  +  Good for kids</text>
      <text x="0" y="68" class="legend">→ kid-friendly places rated &gt; 3.0</text>

      <text x="0" y="100" class="legend-h">Top-N strip</text>
      <text x="0" y="118" class="legend">Re-ranks within the filtered set.</text>
    </g>
  </g>
</svg>
